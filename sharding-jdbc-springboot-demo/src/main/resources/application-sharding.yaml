spring:
  shardingsphere:
    datasource:
      names: ds0,ds1
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://127.0.0.1:3306/ds0?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
        username: root
        password: 123456
      ds1:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://127.0.0.1:3306/ds1?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
        username: root
        password: 123456
    sharding:
      tables:
        t_order:
          logic-table: t_order
          actual-data-nodes: ds${0..1}.t_order${0..1}
          table-strategy:
            inline:
              sharding-column: order_id
              algorithm-expression: t_order${order_id % 2}
          database-strategy:
            inline:
              algorithm-expression: ds${user_id % 2}
              sharding-column: user_id